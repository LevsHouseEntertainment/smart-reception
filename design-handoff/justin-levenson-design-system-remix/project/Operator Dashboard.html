<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Smart Reception — Operator Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* Density modulation, applied to root */
  body[data-density="compact"]  { --sr-row-h: 52px; --sr-pad: 14px; font-size: 13px; }
  body[data-density="regular"]  { --sr-row-h: 64px; --sr-pad: 20px; font-size: 14px; }
  body[data-density="comfy"]    { --sr-row-h: 76px; --sr-pad: 26px; font-size: 14.5px; }

  /* Palette swap */
  body[data-palette="sage"] {
    --sr-color-brand: #3F5246;
    --sr-color-accent: #B5722E;
    --sr-canvas: #F0EBDF;
    --sr-canvas-2: #E5DFCF;
    --sr-paper: #F8F4EA;
    --sr-paper-edge: #DFD7C4;
  }
  body[data-palette="hearth"] {
    --sr-color-brand: #4A2D24;
    --sr-color-accent: #C97B3A;
    --sr-canvas: #F2EBDF;
    --sr-canvas-2: #E6DCC9;
    --sr-paper: #FBF5E9;
    --sr-paper-edge: #E0D4BC;
  }

  .sr-app {
    max-width: 1480px;
    margin: 0 auto;
  }
  .sr-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    padding: 0 28px 60px;
  }
  @media (max-width: 1180px) {
    .sr-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-screen-label="01 Operator Dashboard" data-density="regular" data-palette="linen">

<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "linen",
  "density": "regular",
  "voice": "warm",
  "showHeadsUp": true,
  "fontSize": 14,
  "accent": "#C49A2A",
  "animateGlyph": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [selected, setSelected] = React.useState("c-203");

  React.useEffect(() => {
    document.body.dataset.density = t.density;
    document.body.dataset.palette = t.palette;
    document.body.style.fontSize = t.fontSize + "px";
    document.documentElement.style.setProperty("--sr-color-accent", t.accent);
  }, [t.density, t.palette, t.fontSize, t.accent]);

  const liveCall = CALLS.find(c => c.status === "live");
  const selectedCall = CALLS.find(c => c.id === selected && c.status !== "live");

  return (
    <div className="sr-app">
      <TopBar />
      <HeroStrip density={t.density} />

      <div className="sr-grid">
        <main style={{ display: "flex", flexDirection: "column", gap: 24, minWidth: 0 }}>
          <LiveCallCard call={liveCall} />
          <CallList selected={selected} onSelect={setSelected} />
        </main>

        <aside style={{ display: "flex", flexDirection: "column", gap: 24, minWidth: 0 }}>
          {selectedCall ? (
            <CallDetail call={selectedCall} onClose={() => setSelected(null)} />
          ) : (
            <>
              {t.showHeadsUp && <HeadsUpCard />}
              <ScheduleCard />
              <VoiceCard voice={t.voice} />
            </>
          )}
        </aside>
      </div>

      <footer style={{
        padding: "20px 28px 40px",
        display: "flex", gap: 16, alignItems: "center",
        color: "var(--sr-ink-3)",
      }}>
        <span className="sr-eyebrow">SMART RECEPTION · v0.1</span>
        <span className="sr-eyebrow" style={{ color: "var(--sr-ink-4)" }}>·</span>
        <span className="sr-small">Built for service operators on a phone or laptop, often between jobs.</span>
        <div style={{ flex: 1 }} />
        <SRGlyph size={18} animated={t.animateGlyph} color="var(--sr-ink-3)" />
      </footer>

      <TweaksPanel title="Tweaks · Smart Reception">
        <TweakSection label="Palette" />
        <TweakRadio  label="Direction" value={t.palette}
                     options={[
                       { value: "linen",  label: "Linen" },
                       { value: "sage",   label: "Sage" },
                       { value: "hearth", label: "Hearth" },
                     ]}
                     onChange={(v) => setTweak('palette', v)} />
        <TweakColor  label="Accent" value={t.accent}
                     onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Layout" />
        <TweakRadio  label="Density" value={t.density}
                     options={["compact", "regular", "comfy"]}
                     onChange={(v) => setTweak('density', v)} />
        <TweakSlider label="Base font" value={t.fontSize} min={12} max={17} unit="px"
                     onChange={(v) => setTweak('fontSize', v)} />
        <TweakToggle label="Heads-up card" value={t.showHeadsUp}
                     onChange={(v) => setTweak('showHeadsUp', v)} />

        <TweakSection label="Receptionist" />
        <TweakRadio  label="Voice" value={t.voice}
                     options={[
                       { value: "warm",  label: "Warm" },
                       { value: "plain", label: "Plain" },
                       { value: "crew",  label: "Crew" },
                     ]}
                     onChange={(v) => setTweak('voice', v)} />
        <TweakToggle label="Animate glyph" value={t.animateGlyph}
                     onChange={(v) => setTweak('animateGlyph', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
