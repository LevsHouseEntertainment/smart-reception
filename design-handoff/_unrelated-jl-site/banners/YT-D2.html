<!doctype html>
<html><head><meta charset="utf-8"><title>YouTube — D2</title>
<link rel="stylesheet" href="banners.css">
<style>
  html, body { margin:0; padding:0; background:#203235; width:1600px; height:900px; overflow:hidden; }
  .frame { position:relative; width:1600px; height:900px; background:#203235; color:#E6E7E8; font-family:'Galano Grotesque', sans-serif; -webkit-font-smoothing:antialiased; }
  .photo {
    position:absolute; right:0; top:0; bottom:0; width:1100px;
    background-image:url('assets/justin-portrait.jpg');
    background-size:cover; background-position:50% 18%;
    filter:contrast(1.05) brightness(0.96);
  }
  .scrim { position:absolute; right:0; top:0; bottom:0; width:1100px;
    background: linear-gradient(90deg, #203235 0%, rgba(32,50,53,0.92) 18%, rgba(32,50,53,0.4) 55%, rgba(32,50,53,0) 100%); }
  .center {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:966px; height:264px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .jl { position:absolute; left:0; top:0; width:48px; height:48px;
    display:flex; align-items:center; justify-content:center; }
  .jl img { width:100%; filter:brightness(0) invert(1); opacity:0.85; }
  .eyebrow { font-family:'Messina Sans Mono'; font-weight:400;
    font-size:14px; letter-spacing:0.42em; text-transform:uppercase;
    color:#8a9298; margin:60px 0 18px; }
  .name { font-family:'Galano Grotesque'; font-weight:500;
    font-size:64px; letter-spacing:0.08em; line-height:1;
    color:#E6E7E8; margin:0; }
  .tick { width:72px; height:1px; background:#5A656B; margin:24px 0 16px; }
  .sub { font-family:'Messina Sans Mono'; font-weight:400;
    font-size:15px; letter-spacing:0.34em; text-transform:uppercase;
    color:#9aa2a8; margin:0; }
</style></head><body>
<div class="frame">
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="center">
    <div class="jl"><img src="assets/jl-mark.png" alt=""></div>
    <p class="eyebrow">— From the Center</p>
    <h1 class="name">JUSTIN LEVENSON</h1>
    <div class="tick"></div>
    <p class="sub">Author · Speaker · Nashville</p>
  </div>
</div>
</body></html>
