<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FB Banner — Photo Left</title>
<link rel="stylesheet" href="banners.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .pl .photo {
    position: absolute; left: 0; top: 0; bottom: 0; width: 320px;
    background-image: url('assets/justin-portrait.jpg');
    background-size: cover; background-position: 50% 28%;
    filter: contrast(1.04) brightness(0.96);
  }
  .pl .fade { position: absolute; left: 280px; width: 120px; top: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(32,50,53,0) 0%, #203235 100%); }
  .pl .text { position: absolute; left: 380px; right: 50px; top: 50%; transform: translateY(-50%); }
  .pl .name {
    font-family: 'Galano Grotesque'; font-weight: 500;
    font-size: 56px; letter-spacing: 0.08em; line-height: 1;
    color: #E6E7E8; margin: 0;
  }
  .pl .tick { width: 48px; height: 1px; background: #5A656B; margin: 18px 0; }
  .pl .sub {
    font-family: 'Messina Sans Mono'; font-weight: 400;
    font-size: 14px; letter-spacing: 0.34em; text-transform: uppercase;
    color: #8a9298; margin: 0;
  }
  .pl .jl {
    position: absolute; right: 32px; top: 32px;
    width: 44px; height: 44px;
    border: 1px solid rgba(230,231,232,0.55);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .pl .jl img { width: 60%; filter: brightness(0) invert(1); opacity: 0.85; }
</style></head><body>
<div class="banner pl" data-screen-label="A Photo Left">
  <div class="photo"></div>
  <div class="fade"></div>
  <div class="jl"><img src="assets/jl-mark.png" alt=""></div>
  <div class="text">
    <h1 class="name">JUSTIN LEVENSON</h1>
    <div class="tick"></div>
    <p class="sub">Author · Speaker · Nashville</p>
  </div>
</div></body></html>
