<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-off-white); padding: 20px 28px; font-family: 'Galano Grotesque', sans-serif; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.token { background: var(--color-warm-white); border: 1px solid var(--color-cool-grey); padding: 10px; }
.dot { width: 28px; height: 28px; margin-bottom: 8px; border: 1px solid rgba(0,0,0,0.06); }
.name { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-deep-sea); }
.desc { font-size: 10px; color: var(--color-mist); margin-top: 2px; }
</style></head><body>
<div class="grid">
  <div class="token"><div class="dot" style="background:var(--bg-primary); border:1px solid #ddd"></div><div class="name">bg-primary</div><div class="desc">Page background</div></div>
  <div class="token"><div class="dot" style="background:var(--bg-elevated); border:1px solid #ddd"></div><div class="name">bg-elevated</div><div class="desc">Cards, panels</div></div>
  <div class="token"><div class="dot" style="background:var(--bg-dark)"></div><div class="name">bg-dark</div><div class="desc">Deep Sea sections</div></div>
  <div class="token"><div class="dot" style="background:var(--bg-muted)"></div><div class="name">bg-muted</div><div class="desc">Mist fill</div></div>
  <div class="token"><div class="dot" style="background:var(--text-primary)"></div><div class="name">text-primary</div><div class="desc">Deep Sea text</div></div>
  <div class="token"><div class="dot" style="background:var(--text-secondary)"></div><div class="name">text-secondary</div><div class="desc">Mist text</div></div>
  <div class="token"><div class="dot" style="background:var(--text-muted)"></div><div class="name">text-muted</div><div class="desc">Labels, meta</div></div>
  <div class="token"><div class="dot" style="background:var(--color-cool-grey); border:1px solid #ccc"></div><div class="name">cool-grey</div><div class="desc">Dividers, borders</div></div>
  <div class="token"><div class="dot" style="background:var(--button-primary-bg)"></div><div class="name">button-bg</div><div class="desc">CTA — Deep Sea</div></div>
  <div class="token"><div class="dot" style="background:var(--color-charcoal)"></div><div class="name">charcoal</div><div class="desc">Warm dark</div></div>
  <div class="token"><div class="dot" style="background:var(--color-storm)"></div><div class="name">storm</div><div class="desc">Dark warm grey</div></div>
  <div class="token"><div class="dot" style="background:var(--link-hover)"></div><div class="name">link-hover</div><div class="desc">Mist on hover</div></div>
</div>
</body></html>
