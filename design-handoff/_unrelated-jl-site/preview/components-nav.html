<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-off-white); padding: 0; }
nav { background: var(--color-warm-white); border-bottom: 1px solid var(--color-border); padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
.nav-brand { font-family: var(--font-display); font-size: 18px; font-weight: 300; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-primary); }
.nav-links { display: flex; gap: 32px; }
.nav-link { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); text-decoration: none; font-weight: 500; }
.nav-link-active { color: var(--text-primary); border-bottom: 1px solid var(--text-primary); padding-bottom: 1px; }
</style></head><body>
<nav>
  <div class="nav-brand">Justin Levenson</div>
  <div class="nav-links">
    <a class="nav-link nav-link-active">The Book</a>
    <a class="nav-link">From the Center</a>
  </div>
</nav>
</body></html>
