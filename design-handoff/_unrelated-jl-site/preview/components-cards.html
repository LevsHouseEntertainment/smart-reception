<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-off-white); padding: 20px; font-family: var(--font-body); display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.card { background: var(--color-warm-white); border: 1px solid var(--color-border); padding: 28px 28px 24px; max-width: 240px; }
.number { font-family: var(--font-display); font-size: 28px; font-weight: 300; color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 10px; }
.card-title { font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-primary); margin-bottom: 8px; }
.card-body { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }
.divider-card { background: var(--color-dark-navy); color: var(--color-warm-white); padding: 20px 24px; max-width: 240px; }
.quote { font-family: var(--font-serif); font-size: 14px; font-style: italic; line-height: 1.5; color: rgba(255,255,255,0.85); }
.attribution { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-top: 10px; }
</style></head><body>
  <div class="card">
    <div class="number">01</div>
    <div class="card-title">Think It. See It. Feel It.</div>
    <div class="card-body">Affirm, Visualize, Feel — simple enough to do tonight.</div>
  </div>
  <div class="card">
    <div class="number">02</div>
    <div class="card-title">Healing affirmations</div>
    <div class="card-body">The exact words from the radiation table. Chapter by chapter.</div>
  </div>
  <div class="divider-card">
    <div class="quote">"This is going to be the most positive experience of my life."</div>
    <div class="attribution">— Justin's first words upon diagnosis</div>
  </div>
</body></html>
