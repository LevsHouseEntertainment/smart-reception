<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-off-white); padding: 28px 32px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.btn { display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; border-radius: var(--radius-sm); transition: all 200ms ease; text-decoration: none; }
.btn-primary { background: var(--color-charcoal-deep); color: var(--color-warm-white); border: none; padding: 14px 32px; }
.btn-secondary { background: transparent; color: var(--color-charcoal-deep); border: 1px solid var(--color-charcoal-deep); padding: 13px 32px; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: none; padding: 13px 0; border-bottom: 1px solid var(--color-charcoal); border-radius: 0; }
.btn-dark { background: var(--color-warm-white); color: var(--color-dark-navy); border: none; padding: 14px 32px; }
.group { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
</style></head><body>
  <div class="group">
    <div class="label">Primary</div>
    <a class="btn btn-primary">Get the free guide</a>
    <a class="btn btn-primary" style="opacity:0.7">Hover state</a>
  </div>
  <div class="group">
    <div class="label">Secondary</div>
    <a class="btn btn-secondary">Read it on Amazon</a>
  </div>
  <div class="group">
    <div class="label">Text link arrow</div>
    <a class="btn btn-ghost">You Are Stronger Than You Think →</a>
  </div>
  <div class="group" style="background:var(--color-dark-navy);padding:16px;border-radius:2px">
    <div class="label" style="color:rgba(255,255,255,0.4)">On dark</div>
    <a class="btn btn-dark">Read it on Amazon</a>
  </div>
</body></html>
