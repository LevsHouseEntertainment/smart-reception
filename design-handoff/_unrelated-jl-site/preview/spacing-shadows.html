<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-off-white); padding: 20px 28px; display: flex; gap: 20px; flex-wrap: wrap; }
.shadow-box { background: var(--color-warm-white); display: flex; align-items: center; justify-content: center; width: 120px; height: 64px; border-radius: 2px; }
.label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-top: 8px; }
.item { display: flex; flex-direction: column; align-items: center; }
</style></head><body>
  <div class="item">
    <div class="shadow-box" style="box-shadow:var(--shadow-sm)"></div>
    <div class="label">shadow-sm</div>
  </div>
  <div class="item">
    <div class="shadow-box" style="box-shadow:var(--shadow-md)"></div>
    <div class="label">shadow-md</div>
  </div>
  <div class="item">
    <div class="shadow-box" style="box-shadow:var(--shadow-lg)"></div>
    <div class="label">shadow-lg</div>
  </div>
  <div class="item" style="margin-left:16px">
    <div style="display:flex;gap:6px">
      <div style="height:40px;width:2px;background:var(--color-border)"></div>
      <div style="height:40px;width:2px;background:var(--color-charcoal)"></div>
      <div style="height:40px;width:2px;background:var(--color-charcoal-deep)"></div>
      <div style="height:40px;width:2px;background:var(--color-warm-gold)"></div>
    </div>
    <div class="label">Border weights</div>
  </div>
</body></html>
