<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Ride — Story (Monogram)</title>
<link rel="stylesheet" href="stories.css" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b0b0b;
    min-height: 100vh;
    display: grid; place-items: center;
  }

  /* ==================================================
     Monogram story — the JL mark is the hero
     14s loop. Cold open with the mark, photo resolves.
     ================================================== */
  .mono { cursor: pointer; background: #0b0e10; }

  /* Black field that lifts to reveal photo */
  .mono .field {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% 40%, #121619 0%, #07090a 100%);
    z-index: 0;
  }

  /* Photo — fades up behind monogram */
  .mono .photo-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    opacity: 0;
    animation: photo-resolve 2.6s cubic-bezier(.4,0,.2,1) 2.8s forwards;
  }
  .mono .photo {
    position: absolute;
    inset: -5%;
    background-image: url('assets/justin-portrait.jpg');
    background-size: cover;
    background-position: 50% 20%;
    filter: grayscale(0.35) contrast(1.05) brightness(0.9);
    transform: scale(1.08);
    animation: slow-zoom 16s ease-out 2.8s forwards;
  }
  @keyframes photo-resolve {
    0%   { opacity: 0; }
    100% { opacity: 0.82; }
  }
  @keyframes slow-zoom {
    to { transform: scale(1.02); }
  }

  /* Vignette */
  .mono .vignette {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(110% 75% at 50% 38%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.60) 100%),
      linear-gradient(180deg, rgba(32,50,53,0.15) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }

  /* ==================================================
     MONOGRAM — SVG, draws itself in
     Centered upper area, then shrinks to seal size
     ================================================== */
  .mono .monogram {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%) scale(1);
    width: 480px;
    height: 480px;
    transform-origin: center;
    animation: monogram-journey 14s ease-in-out infinite;
  }
  .mono .monogram svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .mono .monogram .stroke {
    fill: none;
    stroke: #E6E7E8;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 2400;
    stroke-dashoffset: 2400;
    animation: draw-mono 2.6s cubic-bezier(.7,0,.3,1) 0.4s forwards;
  }
  @keyframes draw-mono {
    to { stroke-dashoffset: 0; }
  }

  /* Monogram journey: big center → small bottom seal */
  @keyframes monogram-journey {
    0%   { left: 50%; top: 30%; width: 480px; height: 480px; opacity: 1; }
    22%  { left: 50%; top: 30%; width: 480px; height: 480px; opacity: 1; }
    38%  { left: 50%; top: 30%; width: 480px; height: 480px; opacity: 1; }
    58%  { left: 50%; top: 30%; width: 420px; height: 420px; opacity: 0.85; }
    76%  { left: 140px; top: calc(100% - 150px); width: 96px; height: 96px; opacity: 1; }
    100% { left: 140px; top: calc(100% - 150px); width: 96px; height: 96px; opacity: 1; }
  }

  /* Wax-seal ring around monogram when it settles */
  .mono .seal-ring {
    position: absolute;
    left: 140px;
    top: calc(100% - 150px);
    width: 96px;
    height: 96px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(230,231,232,0.55);
    border-radius: 50%;
    z-index: 4;
    opacity: 0;
    animation: seal-in 1s ease-out 4.2s forwards;
  }
  @keyframes seal-in {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* ==================================================
     TEXT — reveals in the middle-lower area after monogram lands
     ================================================== */
  .mono .block {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 280px;
    z-index: 6;
  }
  .mono .eyebrow {
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #9aa2a8;
    margin-bottom: 34px;
    opacity: 0;
    transform: translateY(14px);
    animation: up-in 1.2s ease-out 4.8s forwards;
  }
  .mono .quote {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 82px;
    line-height: 1.06;
    letter-spacing: -0.018em;
    color: #F2F3F4;
    margin: 0 0 34px 0;
  }
  .mono .quote .line { display: block; overflow: hidden; }
  .mono .quote .line > span {
    display: block;
    opacity: 0;
    transform: translateY(36px);
    animation: up-in 1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .mono .quote .l1 > span { animation-delay: 5.0s; }
  .mono .quote .l2 > span {
    color: rgba(242,243,244,0.72);
    font-weight: 400;
    animation-delay: 5.5s;
  }

  .mono .callout {
    font-family: var(--font-mono);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: #c8cdd0;
    opacity: 0;
    transform: translateY(14px);
    animation: up-in 1.2s ease-out 6.4s forwards;
    margin: 0;
  }
  .mono .callout em { font-style: normal; color: #F2F3F4; }

  @keyframes up-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ==================================================
     BOTTOM BRAND BAR — next to seal
     ================================================== */
  .mono .brandbar {
    position: absolute;
    left: 220px;
    bottom: 115px;
    right: 60px;
    z-index: 6;
    opacity: 0;
    animation: up-in 1.2s ease-out 4.6s forwards;
    transform: translateY(8px);
  }
  .mono .brandbar .name {
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: #E6E7E8;
    display: block;
    margin-bottom: 6px;
  }
  .mono .brandbar .sub {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8a9298;
  }

  /* Top text — title card moment */
  .mono .topcard {
    position: absolute;
    top: 110px;
    left: 0; right: 0;
    z-index: 6;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(230,231,232,0.55);
    opacity: 0;
    animation: up-in 1.2s ease-out 2.0s forwards, fade-late 2s ease-in 4.8s forwards;
  }
  @keyframes fade-late {
    to { opacity: 0.25; }
  }
</style>
</head>
<body>
  <div class="story mono" id="mono-story" data-screen-label="03 Monogram">
    <div class="field"></div>
    <div class="photo-wrap"><div class="photo"></div></div>
    <div class="vignette"></div>

    <!-- Top -->
    <div class="topcard">Thoughts from the Center</div>

    <!-- Monogram (draws itself, then shrinks to bottom seal) -->
    <div class="monogram">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <!-- Simple, elegant JL interlocked monogram:
             J: vertical stem with a curl at the bottom-left
             L: vertical stem with horizontal foot, interlocked with J -->
        <!-- Outer frame -->
        <circle class="stroke" cx="100" cy="100" r="88" />

        <!-- J -->
        <path class="stroke" d="
          M 78 54
          L 78 122
          Q 78 148  58 148
          Q 44 148  44 132
        " />
        <path class="stroke" d="
          M 66 54
          L 90 54
        " />

        <!-- L (interlocked, slightly offset right) -->
        <path class="stroke" d="
          M 122 54
          L 122 146
          L 158 146
        " />

        <!-- Crossing tick where J stem and L stem meet at center -->
        <path class="stroke" d="
          M 78 100
          L 122 100
        " opacity="0.55" />
      </svg>
    </div>

    <!-- Wax-seal ring that settles with the monogram at bottom-left -->
    <div class="seal-ring"></div>

    <!-- Brand bar next to the seal -->
    <div class="brandbar">
      <span class="name">Justin Levenson</span>
      <span class="sub">From the Center</span>
    </div>

    <!-- Text block -->
    <div class="block">
      <div class="eyebrow">— The Ride</div>
      <h1 class="quote">
        <span class="line l1"><span>Be here now.</span></span>
        <span class="line l2"><span>Even here. Especially here.</span></span>
      </h1>
      <p class="callout"><em>New post</em> — up today on Substack.</p>
    </div>
  </div>

<script>
  // Tap to replay
  document.getElementById('mono-story').addEventListener('click', () => location.reload());
</script>
</body>
</html>
