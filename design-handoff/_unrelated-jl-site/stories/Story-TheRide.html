<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Ride — Story (Motion)</title>
<link rel="stylesheet" href="stories.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b0b;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }

  /* ==================================================
     Motion story — "The Ride"
     A quiet, cinematic loop. 12s total.
     ================================================== */
  .ride { cursor: pointer; }

  /* PHOTO — slow breath / Ken-Burns */
  .ride .photo-wrap {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .ride .photo {
    position: absolute;
    inset: -6%;
    background-image: url('assets/justin-portrait.jpg');
    background-size: cover;
    background-position: 50% 32%;
    filter: contrast(1.02) saturate(0.92);
    animation: breathe 14s ease-in-out infinite;
    will-change: transform, filter;
  }
  @keyframes breathe {
    0%   { transform: scale(1.00) translateY(0);     filter: contrast(1.02) saturate(0.92) brightness(0.98); }
    50%  { transform: scale(1.035) translateY(-12px); filter: contrast(1.04) saturate(0.94) brightness(1.02); }
    100% { transform: scale(1.00) translateY(0);     filter: contrast(1.02) saturate(0.92) brightness(0.98); }
  }

  /* Vignette — deepens the edges so the face sits in light */
  .ride .vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(120% 80% at 50% 35%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  /* MIST — drifting particle layer, drawn in canvas */
  .ride .mist {
    position: absolute;
    inset: 0;
    z-index: 2;
    mix-blend-mode: screen;
    opacity: 0.55;
    pointer-events: none;
  }

  /* Bottom gradient for text legibility */
  .ride .scrim {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    bottom: 0;
    z-index: 3;
    background: linear-gradient(
      180deg,
      rgba(10,14,16,0.00) 0%,
      rgba(10,14,16,0.30) 30%,
      rgba(10,14,16,0.78) 70%,
      rgba(10,14,16,0.94) 100%
    );
    pointer-events: none;
  }

  /* ==================================================
     TOP CHROME — brand tag, drawn line
     ================================================== */
  .ride .topbar {
    position: absolute;
    top: 70px;
    left: 60px;
    right: 60px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    color: var(--cool-grey);
    font-size: 22px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 1.4s ease-out 0.3s forwards;
  }
  .ride .topbar .left { display: flex; align-items: center; gap: 20px; }
  .ride .topbar .dot {
    width: 7px; height: 7px;
    background: var(--cool-grey);
    border-radius: 50%;
    opacity: 0.85;
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 0.95; transform: scale(1.15); }
  }
  .ride .topbar .right {
    font-size: 18px;
    letter-spacing: 0.22em;
    color: #8a9298;
  }

  /* Horizontal drawn rule under topbar */
  .ride .top-rule {
    position: absolute;
    top: 124px;
    left: 60px;
    height: 1px;
    background: rgba(230,231,232,0.35);
    z-index: 5;
    width: 0;
    animation: draw-line 1.6s cubic-bezier(.7,0,.3,1) 0.6s forwards;
  }
  @keyframes draw-line {
    to { width: calc(100% - 120px); }
  }

  /* ==================================================
     TEXT BLOCK — bottom third
     ================================================== */
  .ride .text {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 120px;
    z-index: 6;
  }

  .ride .eyebrow {
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8a9298;
    margin-bottom: 38px;
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0;
    animation: fade-up 1.2s ease-out 1.2s forwards;
  }
  .ride .eyebrow .tick {
    width: 42px;
    height: 1px;
    background: #8a9298;
  }

  .ride .quote {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 88px;
    line-height: 1.04;
    letter-spacing: -0.018em;
    color: var(--cool-grey);
    margin: 0 0 44px 0;
  }
  .ride .quote .line {
    display: block;
    overflow: hidden;
  }
  .ride .quote .line .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(42px);
    animation: word-in 1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .ride .quote .line-2 {
    color: rgba(230,231,232,0.72);
    font-weight: 400;
    margin-top: 10px;
  }
  @keyframes word-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Thin rule between quote and callout — wipes in */
  .ride .mid-rule {
    width: 80px;
    height: 1px;
    background: var(--mist);
    opacity: 0;
    margin-bottom: 30px;
    transform-origin: left center;
    transform: scaleX(0);
    animation: rule-in 1.2s cubic-bezier(.7,0,.3,1) 3.4s forwards;
  }
  @keyframes rule-in {
    to { opacity: 0.85; transform: scaleX(1); }
  }

  .ride .callout {
    font-family: var(--font-mono);
    font-size: 28px;
    letter-spacing: 0.02em;
    color: #c2c8cc;
    line-height: 1.4;
    margin: 0 0 44px 0;
    opacity: 0;
    animation: fade-up 1.2s ease-out 3.8s forwards;
  }
  .ride .callout em {
    font-style: normal;
    color: var(--cool-grey);
  }
  .ride .callout .cursor {
    display: inline-block;
    width: 10px; height: 26px;
    vertical-align: -4px;
    margin-left: 6px;
    background: var(--cool-grey);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Brand tag */
  .ride .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8a9298;
    opacity: 0;
    animation: fade-up 1.2s ease-out 4.4s forwards;
  }
  .ride .brand .left {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .ride .brand .mark {
    width: 34px;
    height: 1px;
    background: #8a9298;
  }
  .ride .brand .right {
    font-size: 16px;
    letter-spacing: 0.3em;
    color: #606a70;
  }

  /* ================== Generic kf ================== */
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Progress bar — Instagram-style, very subtle */
  .ride .progress {
    position: absolute;
    top: 32px;
    left: 60px;
    right: 60px;
    height: 2px;
    background: rgba(255,255,255,0.18);
    z-index: 7;
    border-radius: 2px;
    overflow: hidden;
  }
  .ride .progress .fill {
    width: 0;
    height: 100%;
    background: rgba(230,231,232,0.95);
    animation: progress 12s linear infinite;
  }
  @keyframes progress {
    0%   { width: 0; }
    100% { width: 100%; }
  }

  /* Corner tick marks (brand crop marks) */
  .ride .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    z-index: 5;
    opacity: 0;
    animation: fade-in 1.2s ease-out 0.8s forwards;
  }
  .ride .corner::before, .ride .corner::after {
    content: "";
    position: absolute;
    background: rgba(230,231,232,0.35);
  }
  .ride .corner::before { width: 24px; height: 1px; }
  .ride .corner::after  { width: 1px;  height: 24px; }
  .ride .corner.bl { bottom: 60px; left: 60px; }
  .ride .corner.bl::before { bottom: 0; left: 0; }
  .ride .corner.bl::after  { bottom: 0; left: 0; }
  .ride .corner.br { bottom: 60px; right: 60px; }
  .ride .corner.br::before { bottom: 0; right: 0; }
  .ride .corner.br::after  { bottom: 0; right: 0; }

  /* Replay hint */
  .replay-hint {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="story ride" id="story" data-screen-label="01 The Ride">
    <div class="photo-wrap"><div class="photo"></div></div>
    <div class="vignette"></div>
    <canvas class="mist" id="mist"></canvas>
    <div class="scrim"></div>

    <!-- Top -->
    <div class="progress"><div class="fill"></div></div>
    <div class="topbar">
      <div class="left"><span class="dot"></span><span>From the Center</span></div>
      <div class="right">Thoughts from the Center</div>
    </div>
    <div class="top-rule"></div>

    <!-- Corner marks -->
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Bottom text -->
    <div class="text">
      <div class="eyebrow">
        <span class="tick"></span>
        <span>A letter · April 2026</span>
      </div>

      <h1 class="quote" id="quote">
        <span class="line line-1"></span>
        <span class="line line-2"></span>
      </h1>

      <div class="mid-rule"></div>

      <p class="callout"><em>The Ride</em>&nbsp;&nbsp;— new post up today<span class="cursor"></span></p>

      <div class="brand">
        <div class="left"><span class="mark"></span><span>From the Center</span></div>
        <div class="right">JL · 01</div>
      </div>
    </div>

    <div class="replay-hint">tap to replay</div>
  </div>

<script>
  // === Word-by-word quote reveal ===
  // Using JS so we can precisely stagger each word's animation-delay.
  (function buildQuote() {
    const line1 = document.querySelector('.ride .line-1');
    const line2 = document.querySelector('.ride .line-2');
    const w1 = ['Be', 'here', 'now.'];
    const w2 = ['Even', 'here.', 'Especially', 'here.'];

    function addWords(el, words, startDelay) {
      words.forEach((w, i) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = w;
        span.style.animationDelay = (startDelay + i * 0.18) + 's';
        el.appendChild(span);
        el.appendChild(document.createTextNode(' '));
      });
    }
    addWords(line1, w1, 1.6);
    addWords(line2, w2, 2.4);
  })();

  // === Mist particles ===
  // A gentle fog layer. Slow, low-opacity, brand-neutral.
  (function mist() {
    const canvas = document.getElementById('mist');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const N = 22;
    const particles = Array.from({length: N}, () => spawn());

    function spawn(seedY) {
      return {
        x: Math.random() * canvas.width,
        y: seedY !== undefined ? seedY : Math.random() * canvas.height,
        r: 180 + Math.random() * 320,     // soft blobs
        vx: (Math.random() - 0.5) * 0.15,
        vy: -0.08 - Math.random() * 0.12, // drift upward
        a: 0.02 + Math.random() * 0.05,   // very low opacity
        hue: Math.random() < 0.5 ? 'rgba(230,231,232,' : 'rgba(138,146,152,',
      };
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y + p.r < -50 || p.x < -p.r || p.x > canvas.width + p.r) {
          Object.assign(p, spawn(canvas.height + 50));
        }
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        grd.addColorStop(0, p.hue + p.a + ')');
        grd.addColorStop(1, p.hue + '0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  // === Tap to replay ===
  document.getElementById('story').addEventListener('click', () => {
    const root = document.getElementById('story');
    // re-trigger CSS animations by cloning
    const clone = root.cloneNode(true);
    root.parentNode.replaceChild(clone, root);
    clone.id = 'story';
    // re-attach listener
    clone.addEventListener('click', () => location.reload());
    // rebuild words
    const line1 = clone.querySelector('.line-1');
    const line2 = clone.querySelector('.line-2');
    line1.innerHTML = ''; line2.innerHTML = '';
    const add = (el, words, start) => words.forEach((w, i) => {
      const s = document.createElement('span');
      s.className = 'word'; s.textContent = w;
      s.style.animationDelay = (start + i * 0.18) + 's';
      el.appendChild(s); el.appendChild(document.createTextNode(' '));
    });
    add(line1, ['Be','here','now.'], 1.6);
    add(line2, ['Even','here.','Especially','here.'], 2.4);
  });
</script>
</body>
</html>
