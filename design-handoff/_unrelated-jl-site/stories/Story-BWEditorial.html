<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Ride — Story (B&W Editorial)</title>
<link rel="stylesheet" href="stories.css" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0b; min-height: 100vh; display: grid; place-items: center; }

  .bw .photo {
    position: absolute; inset: 0;
    background-image: url('assets/justin-portrait.jpg');
    background-size: cover;
    background-position: 50% 22%;
    filter: grayscale(1) contrast(1.12) brightness(0.94);
    z-index: 0;
  }

  /* Film grain overlay — SVG noise */
  .bw .grain {
    position: absolute; inset: 0; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.9 0 0 0 0 0.9 0 0 0 0.35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size: 260px 260px;
    mix-blend-mode: overlay;
    opacity: 0.55;
    pointer-events: none;
  }

  /* Bottom scrim */
  .bw .scrim {
    position: absolute; left: 0; right: 0; top: 50%; bottom: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.94) 100%);
    pointer-events: none;
  }

  /* Top thin rule + caption — film still / Criterion vibe */
  .bw .cap {
    position: absolute; top: 70px; left: 60px; right: 60px; z-index: 4;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #d4d5d6;
  }
  .bw .cap .dot { width: 8px; height: 8px; background: #d4d5d6; border-radius: 50%; display: inline-block; margin-right: 14px; vertical-align: middle; }
  .bw .cap .right { color: #8a9298; font-size: 15px; letter-spacing: 0.22em; }
  .bw .toprule {
    position: absolute; top: 120px; left: 60px; right: 60px; height: 1px;
    background: rgba(230,231,232,0.45); z-index: 4;
  }

  /* Bottom rule — mirrors top */
  .bw .botrule {
    position: absolute; bottom: 120px; left: 60px; right: 60px; height: 1px;
    background: rgba(230,231,232,0.45); z-index: 4;
  }

  /* Corner crop marks */
  .bw .corner {
    position: absolute; width: 22px; height: 22px; z-index: 4;
  }
  .bw .corner::before, .bw .corner::after { content: ""; position: absolute; background: rgba(230,231,232,0.45); }
  .bw .corner::before { width: 22px; height: 1px; }
  .bw .corner::after  { width: 1px; height: 22px; }
  .bw .corner.tl { top: 120px; left: 60px; }
  .bw .corner.tl::before { top: 0; left: 0; }
  .bw .corner.tl::after  { top: 0; left: 0; }
  .bw .corner.tr { top: 120px; right: 60px; }
  .bw .corner.tr::before { top: 0; right: 0; }
  .bw .corner.tr::after  { top: 0; right: 0; }
  .bw .corner.bl { bottom: 120px; left: 60px; }
  .bw .corner.bl::before { bottom: 0; left: 0; }
  .bw .corner.bl::after  { bottom: 0; left: 0; }
  .bw .corner.br { bottom: 120px; right: 60px; }
  .bw .corner.br::before { bottom: 0; right: 0; }
  .bw .corner.br::after  { bottom: 0; right: 0; }

  /* Text block */
  .bw .text {
    position: absolute; left: 80px; right: 80px; bottom: 200px; z-index: 5;
  }
  .bw .chapter {
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #9aa2a8;
    margin-bottom: 30px;
    display: flex; align-items: center; gap: 16px;
  }
  .bw .chapter .n {
    color: #E6E7E8;
    font-weight: 400;
  }
  .bw .chapter .tick { width: 40px; height: 1px; background: #9aa2a8; }

  .bw .quote {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 76px;
    line-height: 1.1;
    letter-spacing: -0.012em;
    color: #F5F5F4;
    margin: 0 0 32px 0;
  }
  .bw .quote .second {
    display: block;
    color: #b4b5b4;
    font-weight: 300;
    font-style: italic;
    margin-top: 10px;
  }

  .bw .callout {
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #c8c9c9;
    margin: 0;
  }
  .bw .callout em { font-style: normal; color: #F5F5F4; }

  /* Side label (Criterion spine feel) */
  .bw .spine {
    position: absolute;
    right: 34px;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    transform-origin: center;
    z-index: 4;
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(230,231,232,0.55);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="story bw" data-screen-label="04 B&W Editorial">
    <div class="photo"></div>
    <div class="grain"></div>
    <div class="scrim"></div>

    <!-- Top caption row -->
    <div class="cap">
      <span><span class="dot"></span>From the Center</span>
      <span class="right">A short read · April 2026</span>
    </div>
    <div class="toprule"></div>
    <div class="botrule"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="spine">Justin Levenson · The Ride</div>

    <div class="text">
      <div class="chapter"><span class="tick"></span><span>The Ride — A letter</span></div>
      <h1 class="quote">
        Be here now.
        <span class="second">Even here. Especially here.</span>
      </h1>
      <p class="callout"><em>New post</em> up today on Substack.</p>
    </div>
  </div>
</body>
</html>
