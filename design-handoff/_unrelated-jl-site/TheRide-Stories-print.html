<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Ride — Stories (Print)</title>
<link rel="stylesheet" href="stories/stories.css" />
<style>
  /* Print page setup — each story on its own portrait page, sized to fit
     the 1080x1920 canvas proportionally onto Letter portrait. */
  @page {
    size: 8.5in 15.11in; /* 1080x1920 ratio = 9:16 → preserve aspect */
    margin: 0;
  }
  @media print {
    html, body {
      background: #000 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .feed-page { page: feedpage; }
    @page feedpage {
      size: 8.5in 8.5in; /* square for the 1080x1080 feed post */
      margin: 0;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b0b;
  }

  /* Each iframe container is a full page */
  .page {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: #000;
    break-after: page;
    break-inside: avoid;
    page-break-after: always;
    margin: 0 auto 24px;
  }
  .page iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }

  .feed-page {
    width: 1080px;
    height: 1080px;
  }

  .page:last-child { break-after: auto; page-break-after: auto; }

  /* Cover sheet */
  .cover {
    width: 1080px;
    height: 1920px;
    margin: 0 auto 24px;
    background: #0b0e10;
    color: #E6E7E8;
    padding: 180px 120px;
    box-sizing: border-box;
    font-family: 'Galano Grotesque', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    break-after: page;
    page-break-after: always;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .cover .eyebrow {
    font-family: 'Messina Sans Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: #9aa2a8;
  }
  .cover h1 {
    font-family: 'Galano Grotesque', sans-serif;
    font-weight: 500;
    font-size: 128px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 40px 0 0 0;
    color: #F2F3F4;
  }
  .cover h1 span { display: block; color: rgba(242,243,244,0.6); font-weight: 400; }
  .cover .meta {
    font-family: 'Messina Sans Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8a9298;
    line-height: 2;
  }
  .cover .meta strong { color: #E6E7E8; font-weight: 400; }
  .cover hr {
    border: 0;
    border-top: 1px solid rgba(230,231,232,0.35);
    margin: 40px 0;
  }
</style>
</head>
<body>

  <!-- Cover sheet -->
  <section class="cover">
    <div class="eyebrow">From the Center · Instagram</div>
    <div>
      <h1>The Ride.<span>Five takes.</span></h1>
      <hr />
      <div class="meta">
        <div>01 · Stillness <strong>— static</strong></div>
        <div>02 · The Ride <strong>— motion, 12s</strong></div>
        <div>03 · Monogram <strong>— motion, 14s</strong></div>
        <div>04 · B&amp;W Editorial <strong>— static</strong></div>
        <div>05 · Feed Companion <strong>— 1:1</strong></div>
      </div>
    </div>
    <div class="meta">
      <div>Justin Levenson</div>
      <div>April 2026 · Vol. 014</div>
    </div>
  </section>

  <div class="page"><iframe src="stories/Story-Stillness.html" title="Stillness"></iframe></div>
  <div class="page"><iframe src="stories/Story-TheRide.html" title="The Ride"></iframe></div>
  <div class="page"><iframe src="stories/Story-Monogram.html" title="Monogram"></iframe></div>
  <div class="page"><iframe src="stories/Story-BWEditorial.html" title="B&W Editorial"></iframe></div>
  <div class="page feed-page"><iframe src="stories/Feed-Square.html" title="Feed 1x1"></iframe></div>

<script>
  // Wait for fonts + iframes to load, then auto-print.
  (async () => {
    const iframes = [...document.querySelectorAll('iframe')];
    await Promise.all(iframes.map(f =>
      f.contentDocument && f.contentDocument.readyState === 'complete'
        ? Promise.resolve()
        : new Promise(res => f.addEventListener('load', res, {once: true}))
    ));
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    // also wait on iframe fonts
    await Promise.all(iframes.map(f => {
      try { return f.contentDocument.fonts ? f.contentDocument.fonts.ready : Promise.resolve(); }
      catch(e){ return Promise.resolve(); }
    }));
    await new Promise(r => setTimeout(r, 800));
    window.print();
  })();
</script>
</body>
</html>
